<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Sira Run - Technique Magicien</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Arial', sans-serif; }
        #score {
            position: absolute; top: 20px; left: 20px; color: white;
            font-size: 30px; font-weight: bold; text-shadow: 2px 2px 4px #000; z-index: 10;
        }
        #gameOver {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 50px; font-weight: bold; display: none;
            text-align: center; text-shadow: 4px 4px 8px #000; z-index: 10;
        }
        button {
            padding: 15px 30px; font-size: 25px; cursor: pointer;
            background-color: #f39c12; border: none; color: white; border-radius: 10px; margin-top: 20px;
        }
    </style>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>
</head>
<body>
    <div id="score">0</div>
    <div id="gameOver">PERDU !<br><button onclick="location.reload()">Rejouer</button></div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- REGLAGES ---
        let gameSpeed = 10;
        let jumpForce = 0.20; 
        let gravity = -0.6;

        // --- SCÈNE ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0xe6ddc5, 10, 60);

        // SKYBOX
        new THREE.TextureLoader().load('ciel.jpg', function(texture) {
            texture.mapping = THREE.EquirectangularReflectionMapping;
            scene.background = texture;
        });

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 9);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // LUMIÈRES & SOL
        const light = new THREE.DirectionalLight(0xffffff, 2);
        light.position.set(5, 10, 7);
        light.castShadow = true;
        scene.add(light);
        scene.add(new THREE.HemisphereLight(0xffffff, 0xffffff, 1));

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({ color: 0xe6ddc5 }));
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const grid = new THREE.GridHelper(100, 40, 0x000000, 0x000000);
        grid.position.y = 0.05;
        grid.material.opacity = 0.1;
        grid.material.transparent = true;
        scene.add(grid);

        // --- CHARGEMENT DES 2 PERSONNAGES ---
        let runner, jumper; // Nos deux modèles
        let mixerRun, mixerJump; // Leurs animations
        let playerGroup = new THREE.Group(); // Un conteneur pour les bouger ensemble
        scene.add(playerGroup);
        playerGroup.position.set(-2, 0, 0);

        const loader = new GLTFLoader();

        // 1. Charger le Coureur
        loader.load('run.glb', function (gltf) {
            runner = gltf.scene;
            runner.rotation.y = Math.PI / 2;
            runner.traverse(n => { if(n.isMesh) n.castShadow = true; });
            playerGroup.add(runner); // On l'ajoute au groupe

            mixerRun = new THREE.AnimationMixer(runner);
            if(gltf.animations[0]) {
                const action = mixerRun.clipAction(gltf.animations[0]);
                action.play();
            }
        });

        // 2. Charger le Sauteur (et le cacher au début)
        loader.load('jump.glb', function (gltf) {
            jumper = gltf.scene;
            jumper.rotation.y = Math.PI / 2;
            jumper.traverse(n => { if(n.isMesh) n.castShadow = true; });
            jumper.visible = false; // CACHÉ PAR DÉFAUT !
            playerGroup.add(jumper); // On l'ajoute au groupe

            mixerJump = new THREE.AnimationMixer(jumper);
            if(gltf.animations[0]) {
                const action = mixerJump.clipAction(gltf.animations[0]);
                action.setLoop(THREE.LoopOnce); // Ne joue qu'une fois
                action.clampWhenFinished = true;
                // On ne lance pas play() tout de suite
            }
        });

        // --- LOGIQUE SAUT ---
        let isJumping = false;
        let velocityY = 0;

        function jump() {
            if(!isJumping && !gameOver && runner && jumper) {
                isJumping = true;
                velocityY = jumpForce;

                // LE TOUR DE MAGIE : On échange les modèles
                runner.visible = false;
                jumper.visible = true;

                // On lance l'anim du saut
                if(mixerJump) {
                    // On remet à zéro et on joue
                    const action = mixerJump.clipAction(mixerJump._actions[0]._clip);
                    action.reset();
                    action.play();
                }
            }
        }
        window.addEventListener('click', jump);
        window.addEventListener('keydown', (e) => { if(e.code === 'Space') jump(); });

        // --- OBSTACLES ---
        let obstacles = [];
        let timer = 0;
        let score = 0;
        let gameOver = false;

        function createObstacle() {
            const rock = new THREE.Mesh(
                new THREE.DodecahedronGeometry(0.7),
                new THREE.MeshStandardMaterial({ color: 0x888888 })
            );
            rock.position.set(20, 0.5, 0);
            rock.castShadow = true;
            rock.scale.set(1+Math.random(), 1+Math.random(), 1+Math.random());
            scene.add(rock);
            obstacles.push(rock);
        }

        // --- BOUCLE ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            if(gameOver) return;
            const delta = clock.getDelta();

            // Mettre à jour les deux mixers
            if(mixerRun) mixerRun.update(delta);
            if(mixerJump) mixerJump.update(delta);

            // Physique Y (Gravité sur le GROUPE entier)
            if(playerGroup) {
                if(isJumping) {
                    playerGroup.position.y += velocityY;
                    velocityY += gravity * delta;

                    // Atterrissage
                    if(playerGroup.position.y <= 0) {
                        playerGroup.position.y = 0;
                        isJumping = false;
                        velocityY = 0;

                        // FIN DU TOUR DE MAGIE : On remet le coureur
                        if(runner && jumper) {
                            jumper.visible = false;
                            runner.visible = true;
                        }
                    }
                }
            }

            // Décor
            grid.position.x -= gameSpeed * delta;
            if(grid.position.x < -2.5) grid.position.x = 0;

            // Obstacles
            timer += delta;
            if(timer > 1.8) { createObstacle(); timer = 0; }

            for(let i=obstacles.length-1; i>=0; i--) {
                let ob = obstacles[i];
                ob.position.x -= gameSpeed * delta;
                ob.rotation.z -= delta*2;

                if(Math.abs(ob.position.x - playerGroup.position.x) < 0.8 && playerGroup.position.y < 0.6) {
                    gameOver = true;
                    document.getElementById('gameOver').style.display = 'block';
                }
                
                if(ob.position.x < -10) {
                    scene.remove(ob);
                    obstacles.splice(i, 1);
                    score++;
                    document.getElementById('score').innerText = score;
                }
            }
            renderer.render(scene, camera);
        }
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        animate();
    </script>
</body>
</html>
